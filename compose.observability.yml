# Observability for Claude Code team usage: OTel collector + Prometheus + Grafana.
# Deliberately minimal — no cAdvisor/node/dcgm exporters (RAM budget on 24 GB);
# this is a usage ledger, not a box monitor. Footprint ~400 MB RAM total.
# Grafana is served behind Caddy at /grafana/ (both HTTPS and plain-HTTP blocks).
# See CLAUDE-CODE-TELEMETRY.md.

services:
  # Receives OTLP from every Claude Code session (Linux, macOS, Windows) and
  # re-publishes it as Prometheus metrics on :8889. Stateless.
  # Host ports 4317/4318 must be reachable from client machines
  # (ufw: `sudo ufw allow from <lan-cidr> to any port 4317 proto tcp`).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: otel-collector
    restart: unless-stopped
    networks: [apex]
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (Claude Code default)
      - "4318:4318"   # OTLP HTTP
    deploy:
      resources:
        limits:
          memory: 384m

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks: [apex]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-180d}   # series count is tiny (users × models × types); keep months
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${ACTIVE_ROOT}/srv/prometheus:/prometheus
    deploy:
      resources:
        limits:
          memory: 512m

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks: [apex]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: "https://${SITE_HOST}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Team members can view without logging in; admin login still required to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANON_VIEW:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ${ACTIVE_ROOT}/srv/grafana:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  apex:
    external: true
