# claude-usage — standalone Claude Code usage observability.
#   OTel collector (receives from developer machines) → Prometheus → Grafana.
# Runs on any Docker host; no dependency on the rest of z620-a4000-srv.
# ~400 MB RAM. See README.md (quick start) and CLAUDE-CODE-TELEMETRY.md (guide).

services:
  # Receives OTLP from every Claude Code session and re-publishes it as
  # Prometheus metrics on :8889 (internal). Stateless.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: claude-usage-otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"   # Claude Code default (grpc)
      - "${OTLP_HTTP_PORT:-4318}:4318"
    deploy:
      resources:
        limits:
          memory: 384m

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: claude-usage-prometheus
    restart: unless-stopped
    # Runs as the invoking user so the bind-mounted data dir needs no chown/sudo.
    user: "${PUID:-1000}:${PGID:-1000}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-180d}
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${DATA_ROOT:-./data}/prometheus:/prometheus
    deploy:
      resources:
        limits:
          memory: 512m

  grafana:
    image: grafana/grafana:12.0.2
    container_name: claude-usage-grafana
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      # Standalone: http://<host>:3000/ .  Behind a reverse proxy sub-path:
      # GRAFANA_ROOT_URL=https://box.example/grafana/ + GRAFANA_SUB_PATH=true
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SUB_PATH:-false}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Team members can view without logging in; admin login only to edit.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANON_VIEW:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ${DATA_ROOT:-./data}/grafana:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 512m
