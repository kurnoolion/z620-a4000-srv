global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Claude Code usage telemetry (tokens / cost / sessions per user), relayed by
  # the OTel collector. See CLAUDE-CODE-TELEMETRY.md.
  - job_name: claude-code
    static_configs:
      - targets: ['otel-collector:8889']
