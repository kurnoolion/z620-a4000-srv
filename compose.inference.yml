# vLLM + Kev (time-share) + TEI embed (CPU) + TEI reranker (CPU) on RTX A4000 (16 GB).
#
# GPU memory budget (steady + batch peak, concurrent):
#   kev (bf16 + CUDA Graphs) ~14 GB  LoRA + head on Qwen3.5-4B-Base, time-shared.
#                                    Kev's CudaGraphs grab ~2-3 GB on top of
#                                    the model weights; constants (GRAPH_ROWS,
#                                    GRAPH_ROW) are source-level, not env-tunable.
#   vllm (AWQ, native 32K)   ~8.8 GB VLLM_GPU_UTIL=0.55 of 16 GB, time-shared.
#                                    Leaves plenty for GPU TEI if preferred under
#                                    the vllm profile (edit compose below).
#   tei (embed, CPU)         0 GB    bge-m3 on CPU — short-query embed is fast
#                                    enough (~50-100 ms); 128K-payload embed is
#                                    slower (~15-30 s) but tolerable for the
#                                    cross-carrier exception path.
#   tei-reranker (CPU)       0 GB    bge-reranker-large on CPU; rerank pairs are
#                                    ≤512 tokens → ~100-200 ms per 20-pair batch.
#
# To run EITHER TEI service on GPU (e.g., when the time-share LLM is vllm and
# has spare VRAM): swap its *_IMAGE env to the CUDA tag AND add `<<: *gpu`
# to the service below.
#
# vllm and kev are mutually exclusive via Docker Compose profiles — bring up with
# `make up llm=<vllm|kev>` (that also stops the other if running). TEI + Caddy
# are always started.

x-gpu-reservation: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  vllm:
    profiles: [vllm]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.6.3}
    container_name: vllm
    restart: unless-stopped
    networks: [apex]
    <<: *gpu
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      HF_HOME: /hf-cache
      VLLM_REASONING_PARSER: ${VLLM_REASONING_PARSER}
      VLLM_ROPE_SCALING: ${VLLM_ROPE_SCALING}
    volumes:
      - ${ARCHIVE_ROOT}/models/hf-cache:/hf-cache
      - ${ARCHIVE_ROOT}/models/local:/archive-models:ro
      - ${ACTIVE_ROOT}/models/local:/active-models:ro
    # Model resolver: bare name → check /active-models first (SSD, fast),
    # then /archive-models (HDD); absolute path or HF repo id used as-is.
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        M="${VLLM_MODEL}"
        if [[ "$$M" == /* ]]; then
          MODEL="$$M"; NAME="$$(basename $$M)"
        elif [[ "$$M" == */* ]]; then
          MODEL="$$M"; NAME="$$M"
        elif [ -d "/active-models/$$M" ]; then
          MODEL="/active-models/$$M"; NAME="$$M"
        elif [ -d "/archive-models/$$M" ]; then
          MODEL="/archive-models/$$M"; NAME="$$M"
        else
          echo "ERROR: model '$$M' not found under /active-models or /archive-models" >&2
          exit 1
        fi
        echo "vllm: serving $$MODEL as '$$NAME'"
        PARSER_FLAG=""
        [ -n "$$VLLM_REASONING_PARSER" ] && PARSER_FLAG="--reasoning-parser $$VLLM_REASONING_PARSER --enable-reasoning"
        ROPE_FLAG=""
        [ -n "$$VLLM_ROPE_SCALING" ] && ROPE_FLAG="--rope-scaling $$VLLM_ROPE_SCALING"
        exec python3 -m vllm.entrypoints.openai.api_server \
          --host 0.0.0.0 --port 8000 \
          --model "$$MODEL" \
          --served-model-name "$$NAME" \
          --gpu-memory-utilization ${VLLM_GPU_UTIL:-0.55} \
          --max-model-len ${VLLM_MAX_MODEL_LEN:-32768} \
          --disable-log-requests \
          $$PARSER_FLAG $$ROPE_FLAG
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/health\", timeout=2).status==200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 300s
    shm_size: "4gb"
    ipc: host

  kev:
    profiles: [kev]
    # Pre-built image on this box: `cd kev && sudo ./build-kev-image.sh`.
    # Weights (adapter + Qwen3.5-4B-Base rev 1001bb4d) are baked in — no HF
    # access needed at runtime.
    image: ${KEV_IMAGE:-kev-serve:local}
    container_name: kev
    restart: unless-stopped
    networks: [apex]
    <<: *gpu
    # List form (not map): compose omits unset vars entirely instead of
    # passing them as empty strings. kev.serve uses `int(os.environ.get(
    # "KEV_PREFIX_CACHE", "4"))` — the "4" default fires only when the var
    # is MISSING, not when it's "". Keep .env entries for these commented
    # out unless you want to override kev's own defaults.
    environment:
      - KEV_DTYPE=${KEV_DTYPE:-bf16}
      - KEV_TEMPERATURE
      - KEV_API_KEY
      - KEV_PREFIX_CACHE
      # expandable_segments helps CudaGraphs find room on a tight budget.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    healthcheck:
      # Model loads BEFORE uvicorn listens, so a TCP accept on 8008 means the
      # model is ready. Avoids auth concerns if KEV_API_KEY is set (/v1/* 401s).
      test: ["CMD-SHELL", "python3 -c 'import socket,sys; s=socket.socket(); s.settimeout(2); s.connect((\"localhost\",8008))' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s
    shm_size: "4gb"
    ipc: host

  tei:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.5}
    container_name: tei
    restart: unless-stopped
    networks: [apex]
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /hf-cache
    volumes:
      - ${ARCHIVE_ROOT}/models/hf-cache:/hf-cache
      - ${ARCHIVE_ROOT}/models/local:/local-models:ro
    # TEI_MODEL is a basename under /archive/models/local (where hf-curl-download.sh
    # writes). Stays local — no HF round-trip at startup.
    command:
      - --model-id=/local-models/${TEI_MODEL:-bge-m3}
      - --port=80
      - --huggingface-hub-cache=/hf-cache
      - --max-batch-tokens=${TEI_MAX_BATCH_TOKENS:-32768}
      - --max-concurrent-requests=${TEI_MAX_CONCURRENT:-4}
      - --max-client-batch-size=256
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  tei-reranker:
    # Reranker runs CPU by default — rerank pairs are short (≤512 tokens),
    # so CPU latency is ~100-200 ms per 20-pair batch. Keeping it off GPU
    # frees ~1.3 GB VRAM for the LLM (kev needs ~12 GB with CUDA Graphs).
    # To put it on GPU, set TEI_RERANKER_IMAGE to the CUDA tag AND add
    # `<<: *gpu` here, AND ensure the LLM has <5 GB headroom to give up.
    image: ${TEI_RERANKER_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.5}
    container_name: tei-reranker
    restart: unless-stopped
    networks: [apex]
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /hf-cache
    volumes:
      - ${ARCHIVE_ROOT}/models/hf-cache:/hf-cache
      - ${ARCHIVE_ROOT}/models/local:/local-models:ro
    command:
      - --model-id=/local-models/${TEI_RERANKER_MODEL:-bge-reranker-large}
      - --port=80
      - --huggingface-hub-cache=/hf-cache
      - --max-batch-tokens=${TEI_RERANKER_MAX_BATCH_TOKENS:-16384}
      - --max-concurrent-requests=${TEI_MAX_CONCURRENT:-4}
      - --max-client-batch-size=256
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

networks:
  apex:
    external: true
